# CI: lint and test every pull request; build the production image for
# linux/amd64 (ADR 0006) on pull requests and push it to GHCR from main.
#
# Tests run only on pull requests (#119). They test the merge result with
# the current main, and the ruleset requires branches to be up to date
# before merging, so the squash commit on main is exactly the tested code.
# On main only the image is built and pushed.

name: CI

on:
  pull_request:
  push:
    branches: [main]

# Pull requests: a new push cancels the running check of the same PR.
# main: runs are never cancelled but queued, so every merge gets its image
# (sha-<commit>) and `latest` is always pushed in merge order. GitHub
# keeps at most one pending run per group: with three or more merges in a few
# minutes, the middle pending run is replaced by the newest one.
#
# The template repository itself (marked "Template repository" on GitHub)
# only builds the image and never pushes it; projects created from it push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Lint and test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30

    env:
      # CI-only values; no real secrets needed for tests.
      SECRET_KEY: ci-only-not-secret
      DEBUG: "false"
      ALLOWED_HOSTS: localhost
      DATABASE_URL: postgres://app:app@localhost:5432/app

    steps:
      - uses: actions/checkout@v7

      # setup-uv publishes no moving major tag, so pin the exact version.
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check --output-format=github .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Django checks
        run: |
          uv run python manage.py check
          uv run python manage.py makemigrations --check --dry-run

      - name: Tests
        run: uv run python manage.py test

  # GearsBot challenge bundle (ADR 0020): the committed bundle in
  # sim/gears/challenges_basic/ must match the pinned upstream commit, and the
  # parser's own tests must pass. Fetches only the challenge files (~2 MB).
  gearsbot:
    name: GearsBot
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - name: Fetch the pinned challenge files
        run: |
          git init -q /tmp/gears
          git -C /tmp/gears remote add origin https://github.com/QuirkyCort/gears.git
          git -C /tmp/gears sparse-checkout set --no-cone \
            /public/js/worlds/extra/challenges_basic.js /public/worlds/challenges_basic/
          git -C /tmp/gears fetch -q --depth 1 --filter=blob:none origin "$(cat sim/gears/UPSTREAM)"
          git -C /tmp/gears checkout -q FETCH_HEAD

      - name: Parser tests
        run: python3 -m unittest discover -s sim/gears/tests -v

      - name: Bundle matches the pin
        run: python3 sim/gears/check.py verify /tmp/gears

  # Runs at the same time as the tests (#118): on pull requests it only
  # checks that the image builds; both jobs are required checks. On main it
  # is the only job and pushes the image (#119).
  image:
    name: Build image (linux/amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    env:
      # Push only from main, and never from the template repository itself.
      PUSH: ${{ github.event_name == 'push' && !github.event.repository.is_template }}

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # Pull requests: build only, to verify the Dockerfile on amd64.
      # main: build and push.
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Shown by the website at /version.
          build-args: GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
