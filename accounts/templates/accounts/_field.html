<div class="form-field{% if field.field.widget.input_type == 'checkbox' %} form-field-checkbox{% endif %}">
  {% if field.field.widget.input_type == "checkbox" %}
    {{ field }} {{ field.label_tag }}
  {% else %}
    {{ field.label_tag }} {{ field }}
  {% endif %}
  {% if field.help_text %}<div class="help" id="{{ field.auto_id }}_helptext">{{ field.help_text }}</div>{% endif %}
  {% for error in field.errors %}<p class="field-error"><strong>Fehler:</strong> {{ error }}</p>{% endfor %}
</div>
