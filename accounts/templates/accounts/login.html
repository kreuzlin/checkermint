{% extends "base.html" %}

{% block content %}
  <h1>Anmelden</h1>

  <form method="post" class="form narrow" novalidate>
    {% csrf_token %}
    {% include "accounts/_form_fields.html" %}
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit" class="button">Anmelden</button>
  </form>

  <p class="help">
    <a href="{% url 'accounts:password_reset' %}">Passwort vergessen?</a>
    Ohne hinterlegte E-Mail-Adresse setzt dir ein Coach ein neues Passwort.
  </p>
{% endblock %}
